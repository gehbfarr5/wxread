name: wxread-login

concurrency:
  group: wxread-login
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      command_id:
        description: Telegram command id
        required: false
      source:
        description: Trigger source
        required: false
        default: manual

permissions:
  actions: write
  contents: read

jobs:
  recover-login:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    environment: AutoRead

    steps:
      - name: Set DNS to Google's DNS
        run: |
          echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf
          echo "nameserver 8.8.4.4" | sudo tee -a /etc/resolv.conf

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-capture.txt
          python -m playwright install --with-deps chromium

      - name: Recover WeRead web login
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WXREAD_RECOVERY_CONTROL_URL: ${{ vars.WXREAD_RECOVERY_CONTROL_URL }}
          WXREAD_RECOVERY_CONTROL_TOKEN: ${{ secrets.WXREAD_RECOVERY_CONTROL_TOKEN }}
          WXREAD_SECRET_ENVIRONMENT: ${{ vars.WXREAD_SECRET_ENVIRONMENT }}
          GH_TOKEN: ${{ secrets.GH_PAT_FOR_SECRET_UPDATE }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          WXREAD_READ_WORKFLOW: deploy.yml
        run: |
          python scripts/wxread_login_recover.py \
            --timeout 900 \
            --verify-read-num 1 \
            --environment "${WXREAD_SECRET_ENVIRONMENT:-AutoRead}" \
            --read-workflow "$WXREAD_READ_WORKFLOW"

      - name: Upload QR screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: wxread-login-screenshots
          path: /tmp/wxread-login/*.png
          if-no-files-found: ignore
